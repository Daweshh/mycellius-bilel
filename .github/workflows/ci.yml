name: CI

on:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "test", "prod" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and run tests for API
        run: mvn -f api/pom.xml -B test
